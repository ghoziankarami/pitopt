name: Bug report
description: Something does not work or gives a wrong number
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, ideally with a bundled example (`example_tin`, `porphyry_synthetic`). Never attach confidential block models.
  - type: textarea
    id: log
    attributes:
      label: Error output
      description: Paste the terminal output or the run log (Run → Log run).
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "PitOpt 0.4.0 · macOS 15 · Python 3.12"
    validations:
      required: true
