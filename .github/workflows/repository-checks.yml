name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test the source boundary guard, including failure cases
        run: python -m unittest discover -s .github/scripts -p "test_repository_hygiene.py" -v
      - name: Reject tracked runtime credentials, dependencies and build output
        run: python .github/scripts/check_repository_hygiene.py
