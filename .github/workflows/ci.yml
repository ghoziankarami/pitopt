name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # runs the unit tests; consistency tests over outputs/ skip themselves when there are no runs
      - run: pytest
      - name: engine run + independent consistency checks on the bundled example
        run: |
          python -m pitopt run --config projects/example_tin/project.yaml
          pytest tests/test_results_consistency.py tests/test_outputs_consistency.py
